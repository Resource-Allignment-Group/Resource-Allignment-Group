name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017/test_db
      FLASK_ENV: testing

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ----- BACKEND TESTS -----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        # Ignore the performace tests on typical pushes as
        # they can take a little while to execute
        run: pytest --ignore=tests/test_performance.py

      # ----- PERFORMANCE/SYSTEM TESTS (only on pushes to main) -----
      - name: Install performance dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pip install pytest-benchmark psutil

      - name: Run performance tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest tests/test_performance.py --benchmark-save=none

      # ----- FRONTEND TESTS -----
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --watch=false
